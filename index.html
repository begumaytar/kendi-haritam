<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Güvenli Yol Navigasyonu</title>                                     
 
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- ÜCRETSİZ ROTA VE MESAFE HESABI İÇİN LEAFLET ROUTING MACHINE -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
  <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>

  <style>
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    #map { height: 100%; width: 100%;  }
    
    .msj {
      position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
      background: white; padding: 12px 25px; border-radius: 30px; 
      box-shadow: 0 8px 20px rgba(0,0,0,0.15); z-index: 1000;    
      font-size: 14px; font-weight: 600; text-align: center; color: #333;
    }

    .btn-rota {
      margin-top: 8px; padding: 8px 12px; background: #007bff; color: white;
      border: none; border-radius: 8px; cursor: pointer;
      font-size: 13px; font-weight: bold; width: 100%; transition: 0.2s;
    }
    .btn-rota:hover { background: #0056b3; transform: scale(1.02); }

    /* YENİ ŞATAFATLI ARAMA ÇUBUĞU TASARIMI */
    .arama-kapsayici {
      position: absolute; top: 75px; left: 15px; z-index: 1000;
      background: rgba(255, 255, 255, 0.95); padding: 15px; border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 280px;
      backdrop-filter: blur(5px);
    }
    #arama-input {
      width: 100%; padding: 12px 15px; box-sizing: border-box; 
      border-radius: 25px; border: 2px solid #e0e0e0; outline: none;
      font-size: 14px; font-family: inherit; transition: all 0.3s ease;
      background-color: #f8f9fa; color: #333;
    }
    #arama-input:focus {
      border-color: #007bff; background-color: #fff;
      box-shadow: 0 0 8px rgba(0,123,255,0.3);
    }
    #arama-sonuclari {
      list-style: none; padding: 0; margin: 10px 0 0 0; 
      max-height: 220px; overflow-y: auto; background: transparent;
    }
    #arama-sonuclari li {
      padding: 10px; border-bottom: 1px solid #eee; cursor: pointer; font-size: 13px;
      border-radius: 6px; display: flex; justify-content: space-between; align-items: center;
      transition: background-color 0.2s;
    }
    #arama-sonuclari li:last-child { border-bottom: none; }
    #arama-sonuclari li:hover { background: #e9ecef; color: #007bff; font-weight: 600;}
    .zaman-etiketi {
      font-size: 11px; background: #28a745; color: white; 
      padding: 3px 6px; border-radius: 10px; font-weight: bold;
    }
    #mesafe-bilgisi {
      margin-top: 12px; font-size: 14px; font-weight: bold; color: #007bff; 
      display: none; text-align: center; padding-top: 10px; border-top: 1px dashed #ccc;
    }
    
    .leaflet-routing-container { display: none !important; }
  </style> 
</head>
<body>

  <div class="arama-kapsayici">
    <input type="text" id="arama-input" placeholder="İş yeri ara (Örn: Kafka)..." autocomplete="off">
    <ul id="arama-sonuclari"></ul>
    <div id="mesafe-bilgisi"></div>
  </div>

  <div class="msj" id="msj">Konumunuz bulunuyor...</div>
  <div id="map"></div>

  <script>
    // Zoom kontrollerini varsayılan olarak kapattık (zoomControl: false)
    const map = L.map('map', { zoomControl: false }).setView([37.7500, 29.0950], 14);

    // Zoom kontrolünü sağ alta ekliyoruz
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    L.tileLayer('https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap France | &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    map.createPane('yollarKatmani');
    map.getPane('yollarKatmani').style.zIndex = 350;

    let kulkonum = null;
    let gidilecek = null;  
    let rotaKontrol = null; 
    let yerlerListesi = []; 
    let guncelEnlem = null;
    let guncelBoylam = null;

    // Kuş uçuşu mesafeyi hesaplamak için Haversine Formülü
    function mesafeHesapla(lat1, lon1, lat2, lon2) {
      if(!lat1 || !lon1 || !lat2 || !lon2) return 9999;
      const R = 6371; // Dünya yarıçapı (km)
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = 
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
        Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c; // KM cinsinden sonuç
    }

    if (navigator.geolocation) {
      navigator.geolocation.watchPosition((pos) => {
        guncelEnlem = pos.coords.latitude;
        guncelBoylam = pos.coords.longitude;

        if (!kulkonum) {
          kulkonum = L.marker([guncelEnlem, guncelBoylam]).addTo(map).bindPopup("<b>Şu Anki Konumunuz</b>").openPopup();
          map.setView([guncelEnlem, guncelBoylam], 15);
          document.getElementById('msj').innerText = "Konum bulundu! Arama yapın veya haritaya dokunun.";
        } else {
          kulkonum.setLatLng([guncelEnlem, guncelBoylam]);
        }
      }, (err) => {
        document.getElementById('msj').innerText = "Konumunuzu vermediniz, harita serbest modda.";
      }, { enableHighAccuracy: true });
    }

    function hedefBelirle(lat, lng, isim = "Hedef Noktası") {
      if (gidilecek) map.removeLayer(gidilecek);
      gidilecek = L.marker([lat, lng]).addTo(map).bindPopup(`<b>${isim}</b>`).openPopup();
      document.getElementById('msj').innerText = `Hedef: ${isim}`;

      if (kulkonum) {
        let baslangic = kulkonum.getLatLng();

        if (rotaKontrol) map.removeControl(rotaKontrol);

        rotaKontrol = L.Routing.control({
          waypoints: [ L.latLng(baslangic.lat, baslangic.lng), L.latLng(lat, lng) ],
          routeWhileDragging: false, addWaypoints: false, show: false,
          lineOptions: { styles: [{color: '#007bff', opacity: 0.8, weight: 6}] }
        }).addTo(map);

        rotaKontrol.on('routesfound', function(e) {
          let rota = e.routes[0].summary;
          let mesafeKm = (rota.totalDistance / 1000).toFixed(2);
          let sureDk = Math.round(rota.totalTime / 60); // Saniyeyi dakikaya çevir
          
          let mesafeKutusu = document.getElementById('mesafe-bilgisi');
          mesafeKutusu.style.display = "block";
          mesafeKutusu.innerHTML = `📍 Uzaklık: <b>${mesafeKm} km</b> <br> 🚶‍♂️ Yürüme: <b>~${sureDk} dk</b>`;
        });
      }
    }

    map.on('click', function(e) {
      hedefBelirle(e.latlng.lat, e.latlng.lng, `Seçilen Nokta`);
    });

    fetch('yollar.json')
      .then(response => response.json())
      .then(yolListesi => {
        yolListesi.forEach(yol => {
          const anaCaddeMi = (yol.tur === "Ana Cadde");
          const cizgi = L.polyline(yol.koordinatlar, {
            pane: 'yollarKatmani',
            color: anaCaddeMi ? '#ff7800' : '#888888',
            weight: anaCaddeMi ? 5 : 2,
            opacity: anaCaddeMi ? 0.8 : 0.5
          }).addTo(map);
          cizgi.bindPopup(`<b>${yol.isim}</b><br><span style="color:#666;">Tür: ${yol.tur}</span>`);
        });
      }).catch(e => console.log(e));

    fetch('yerler.json')
      .then(response => response.json())
      .then(veriler => {
        yerlerListesi = veriler; 

        veriler.forEach(yer => {
          let renkKodu = '#dc3545'; 
          const suAn = new Date();
          const suAnSaat = suAn.getHours() + (suAn.getMinutes() / 60);

          if (yer.acilis_saatleri && yer.acilis_saatleri !== "Belirtilmemiş") {
            let saatMetni = yer.acilis_saatleri.toLowerCase();
            if (saatMetni.includes("24/7") || saatMetni.includes("24 saat")) {
              renkKodu = '#28a745';
            } else {
              const saatSablonu = /(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})/;
              const es = saatMetni.match(saatSablonu);
              if (es) {
                let acilis = parseInt(es[1], 10) + (parseInt(es[2], 10) / 60);
                let kapanis = parseInt(es[3], 10) + (parseInt(es[4], 10) / 60);
                let suAnAcik = (kapanis < acilis) ? (suAnSaat >= acilis || suAnSaat <= kapanis) : (suAnSaat >= acilis && suAnSaat <= kapanis);
                renkKodu = suAnAcik ? '#28a745' : '#dc3545';
              }
            }
          } 

          const nokta = L.circleMarker([yer.lat, yer.lon], {
            radius: 12, color: '#ffffff', fillColor: renkKodu, fillOpacity: 0.85, weight: 2
          }).addTo(map);
          nokta.on('click', function(e) { L.DomEvent.stopPropagation(e); });

          let ekBilgiler = "";
          if (yer.telefon) ekBilgiler += `<br><span style="color: #666;">Tel:</span> <a href="tel:${yer.telefon}">${yer.telefon}</a>`;
          
          nokta.bindPopup(`
            <div style="font-size: 13px; min-width: 170px;">
              <strong style="font-size: 14px;">${yer.isim}</strong><br>
              <span style="color: #666;">Kategori:</span> ${yer.kategori}<br>
              <span style="color: #666;">Saat:</span> ${yer.acilis_saatleri}<br>
              ${ekBilgiler} <br>
              <button class="btn-rota" onclick="hedefBelirle(${yer.lat}, ${yer.lon}, '${yer.isim.replace(/'/g, "\\'")}')">Burayı Hedef Seç</button>
            </div>
          `);
        });
      }).catch(e => console.log(e));

    const aramaInput = document.getElementById('arama-input');
    const aramaSonuclari = document.getElementById('arama-sonuclari');

    aramaInput.addEventListener('input', function() {
      const aranan = this.value.toLowerCase();
      aramaSonuclari.innerHTML = ''; 

      if (aranan.length < 1) {
        document.getElementById('mesafe-bilgisi').style.display = "none";
        return;
      }

      // Kelimeyi içerenleri filtrele
      let bulunanlar = yerlerListesi.filter(yer => yer.isim.toLowerCase().includes(aranan));

      // Konum biliniyorsa mesafeye göre sırala (Yakından uzağa)
      if(guncelEnlem && guncelBoylam) {
        bulunanlar.forEach(yer => {
          yer.uzaklikHesap = mesafeHesapla(guncelEnlem, guncelBoylam, yer.lat, yer.lon);
        });
        bulunanlar.sort((a, b) => a.uzaklikHesap - b.uzaklikHesap);
      }

      bulunanlar.slice(0, 15).forEach(yer => { // Sadece en yakın 15 sonucu göster
        const li = document.createElement('li');
        
        let dakikaMetni = "";
        if(yer.uzaklikHesap) {
          let tahminiDk = Math.max(1, Math.round((yer.uzaklikHesap / 5) * 60)); // 5 km/s yürüme hızına göre
          dakikaMetni = `<span class="zaman-etiketi">${tahminiDk} dk</span>`;
        }

        li.innerHTML = `<span>${yer.isim}</span> ${dakikaMetni}`;
        
        li.onclick = function() {
          aramaInput.value = yer.isim; 
          aramaSonuclari.innerHTML = ''; 
          hedefBelirle(yer.lat, yer.lon, yer.isim); 
          map.setView([yer.lat, yer.lon], 16); 
        };
        aramaSonuclari.appendChild(li);
      });
    });
  </script>
</body>
</html>
